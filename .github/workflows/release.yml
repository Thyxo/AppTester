name: Release

# Kør manuelt (Actions → Release → Run workflow) eller ved et versions-tag.
# Tagget v<version> oprettes ud fra "version" i src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests
        working-directory: src-tauri
        run: cargo test
      - name: Byg installer (.msi + .exe)
        run: npx --yes @tauri-apps/cli@2 build --bundles msi,nsis
      - name: Læs version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Opret GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PWA Launcher ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            **Installation på Windows**
            1. Hent `PWA.Launcher_..._x64-setup.exe` herunder og dobbeltklik.
            2. Windows SmartScreen advarer, fordi installeren ikke er kodesigneret:
               klik **Flere oplysninger → Kør alligevel**.
            3. Start **PWA Launcher** fra Start-menuen, klik **✎ Apps** og tilføj dine apps.

            `.msi`-filen er et alternativ til `.exe`, fx til installation for alle brugere.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
