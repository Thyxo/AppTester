[package]
name = "pwa-launcher"
version = "0.4.1"
description = "Native launcher til at køre og teste PWAs/webapps"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pwa_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "gzip"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2"

# Vinduesregion (runde hjørner + hul til hjem-indikatoren) på appens webview.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
webview2-com = "0.39"
