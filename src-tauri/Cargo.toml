[package]
name = "pwa-launcher"
version = "0.1.0"
description = "Native launcher til at køre og teste PWAs/webapps"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pwa_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
