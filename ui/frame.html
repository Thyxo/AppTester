<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Ramme</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="frame.css">
</head>
<body>
  <header id="bar" class="drag">
    <div class="row">
      <span id="name" class="name"></span>
      <button id="dep" class="chip" type="button"></button>
      <span id="sw" class="chip"></span>
      <span id="net" class="chip"></span>
      <span class="spacer"></span>
      <button class="win" data-win="minimize" type="button" title="Minimér" aria-label="Minimér"></button>
      <button class="win close" data-win="close" type="button" title="Luk" aria-label="Luk"></button>
    </div>
    <div class="row tools">
      <button data-action="reload" type="button" title="Genindlæs"></button>
      <button data-action="hard-reload" type="button" title="Hard reload – ny service worker og tom cache"></button>
      <button data-action="clear-data" type="button" title="Ryd alle data for appen…"></button>
      <button data-action="devtools" type="button" title="DevTools"></button>
      <select id="device" title="Enhed" aria-label="Enhed"></select>
      <button id="rotate" data-action="rotate" type="button" title="Vend (portræt/landskab)"></button>
      <button data-action="open-in-browser" type="button" title="Åbn i standardbrowser"></button>
    </div>
  </header>

  <!-- Enhedens kabinet, tegnet i portræt (drejes ved landskab). -->
  <div id="shell" class="drag" hidden>
    <div id="bezel"></div>
    <div id="glass"></div>
    <div id="titlebar"><i></i><i></i><i></i><span id="titlebar-name"></span></div>
    <div id="speaker"></div>
    <div id="camera"></div>
    <div id="homebutton"></div>
    <div id="buttons"></div>
  </div>

  <!-- Det, der ligger på skærmen rundt om appen (vindueskoordinater). -->
  <div id="overlay" hidden>
    <div id="statusbar">
      <span id="clock">9:41</span>
      <span id="sb-icons"></span>
    </div>
    <div id="fill-left" class="fill"></div>
    <div id="fill-right" class="fill"></div>
    <div id="homebar" class="fill"><i></i></div>
    <div id="island"></div>
  </div>

  <div id="grip" title="Træk for at ændre størrelse"></div>
  <script src="frame.js"></script>
</body>
</html>
