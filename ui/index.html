<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>PWA Launcher</h1>
  </header>
  <main>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="grid" class="grid" aria-label="Apps"></ul>
    <p id="empty" class="empty" hidden>Ingen apps endnu – tilføj dem i <code>apps.json</code>.</p>
  </main>
  <script src="main.js"></script>
</body>
</html>
